# hyprsunset profiles: the matching profile is applied at startup and when the
# clock passes each "time". Override temporarily with
#   hyprctl hyprsunset temperature 4000   /   hyprctl hyprsunset identity

# Daytime: no colour shift
profile {
    time = 7:30
    identity = true
}

# Evening: warmer screen
profile {
    time = 21:00
    temperature = 4500
}
