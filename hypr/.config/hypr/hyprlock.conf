# Catppuccin Macchiato
$color = rgba(36,39,58,1.0)          # base
$inner_color = rgba(36,39,58,0.8)    # base
$outer_color = rgba(202,211,245,1.0) # text
$font_color = rgba(202,211,245,1.0)  # text
$check_color = rgba(139,213,202,1.0) # teal
$fail_color = rgba(237,135,150,1.0)  # red

general {
    hide_cursor = true
}

background {
    monitor =
    color = $color
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 600, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = CaskaydiaMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}
