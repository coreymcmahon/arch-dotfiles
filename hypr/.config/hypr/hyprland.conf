# Hyprland configuration (hyprlang / legacy syntax, valid for Hyprland 0.56).
# Hyprland 0.55+ defaults to a Lua config, but a hyprland.conf is still loaded
# when no hyprland.lua exists. Syntax below follows the 0.53+ window-rule and
# 0.51+ gesture formats; see https://wiki.hypr.land/
#
# You can split this configuration into multiple files:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = dolphin
$menu = walker
$browser = brave


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
# Blue-light filter; day/night profiles live in hyprsunset.conf
exec-once = hyprsunset
# On-screen display for volume/brightness changes (used by the media keybinds below)
exec-once = swayosd-server
# Polkit authentication agent (polkit-gnome) for privilege prompts from GUI apps
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Walker 2.x needs its elephant backend running before the launcher is opened.
# Running walker as a GApplication service keeps it resident so SUPER+R opens instantly.
exec-once = elephant
exec-once = walker --gapplication-service
# Auto-mount removable drives (notifications via mako)
exec-once = udiskie
# Dark mode + theme for GTK apps and the GTK portal (file pickers). gsettings is
# idempotent, so re-applying on every start is harmless. Static GTK3 settings
# live in the gtk stow group.
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'catppuccin-macchiato-blue-standard+default'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'catppuccin-macchiato-dark-cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24


#############################
### ENVIRONMENT VARIABLES ###
#############################

# Cursor theme: catppuccin-cursors-macchiato (AUR) ships XCursor and Hyprcursor variants
env = XCURSOR_THEME,catppuccin-macchiato-dark-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-macchiato-dark-cursors
env = HYPRCURSOR_SIZE,24

# Force all apps to use Wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
# If you install kvantum (optional stage) and want it to theme Qt apps, add:
# env = QT_STYLE_OVERRIDE,kvantum

xwayland {
  force_zero_scaling = true
}

###################
### PERMISSIONS ###
###################

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Colours: Catppuccin Macchiato (matches ghostty, waybar, hyprlock and mako)
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    col.active_border = rgb(cad3f5)      # macchiato text
    col.inactive_border = rgba(5b6078aa) # macchiato surface2

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # Nothing in this setup is translucent, so blur would only cost GPU time.
    blur {
        enabled = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    # enabled = yes, please :)
    enabled = no

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = border_size 0, match:float 0, match:workspace w[tv1]
# windowrule = rounding 0, match:float 0, match:workspace w[tv1]
# windowrule = border_size 0, match:float 0, match:workspace f[1]
# windowrule = rounding 0, match:float 0, match:workspace f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
# (dwindle:pseudotile was removed in Hyprland 0.55; the "pseudo" dispatcher still works)
dwindle {
    preserve_split = true # You probably want this
    force_split = 2 # Always split on the right
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # hyprpaper owns the background: skip the built-in logo/splash/wallpaper
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # "Open in editor/browser" from another app focuses the target window
    focus_on_activate = true
    # Middle-click paste is easy to trigger by accident in terminals
    middle_click_paste = false
}

binds {
    # Pressing SUPER+N for the workspace you are already on returns to the previous one
    workspace_back_and_forth = true
}

cursor {
    # Hide the pointer while typing and after 5 s idle
    inactive_timeout = 5
    hide_on_key_press = true
}

ecosystem {
    # Suppress the update-news and donation popups
    no_update_news = true
    no_donation_nag = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # Faster key repeat for Neovim / terminal navigation (default 25 Hz after 600 ms)
    repeat_rate = 40
    repeat_delay = 300

    numlock_by_default = true

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hypr.land/Configuring/Gestures/
# Three-finger horizontal swipe switches workspaces. Remove to disable.
gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Applications
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, $browser

# Session
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, hyprshutdown              # logout/shutdown dialog instead of a bare exit
bind = $mainMod, L, exec, loginctl lock-session     # locks via hypridle's lock_cmd (hyprlock)

# Window state
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,                         # dwindle
bind = $mainMod, J, layoutmsg, togglesplit          # dwindle (togglesplit dispatcher removed in 0.54)
bind = $mainMod, F, fullscreen, 0                   # true fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1             # maximise, keep bar and gaps

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move the active window with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize the active window with mainMod + CTRL + arrow keys (repeats while held)
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, TAB, workspace, previous           # jump back to the last workspace

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (hyprshot). Files go to $XDG_PICTURES_DIR; every mode also copies to the clipboard.
bind = , PRINT, exec, hyprshot -m region --clipboard-only   # select a region, clipboard only
bind = SHIFT, PRINT, exec, hyprshot -m region               # select a region, save + clipboard
bind = $mainMod, PRINT, exec, hyprshot -m window            # pick a window
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m output      # whole monitor

# Colour picker: copies the picked colour as hex to the clipboard
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Laptop multimedia keys for volume and LCD brightness, with swayosd on-screen display
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise --max-volume 100
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Media playback (playerctl via swayosd so the OSD shows the action)
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules
# Syntax (0.53+): windowrule = <effect> <value>, match:<prop> <value>[, match:...]

# Example windowrule
# windowrule = float on, match:class ^(com.mitchellh.ghostty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
