# GTK3 defaults: Catppuccin Macchiato (catppuccin-gtk-theme-macchiato, AUR),
# matching cursors (catppuccin-cursors-macchiato, AUR). Dark mode for GTK4 /
# libadwaita apps comes from the gsettings color-scheme set in hyprland.conf.
[Settings]
gtk-theme-name=catppuccin-macchiato-blue-standard+default
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=catppuccin-macchiato-dark-cursors
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
