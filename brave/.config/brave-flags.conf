# Command-line flags appended by brave-bin's /usr/bin/brave wrapper (one per line).
# Native Wayland instead of XWayland
--ozone-platform-hint=auto
# Store passwords in gnome-keyring (unlocked at login via PAM)
--password-store=gnome-libsecret
# Two-finger swipe for back/forward
--enable-features=TouchpadOverscrollHistoryNavigation
